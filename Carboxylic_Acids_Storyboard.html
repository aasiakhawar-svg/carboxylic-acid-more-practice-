<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carboxylic Acids Storyboard</title>
<style>
:root{--o:#f28c00;--g:#2e9d5b;--b:#2b6cb0;--p:#6a4c93;--r:#e4572e;--bg:#fff8ee;--ink:#1f2a44}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,#f28c00,#e4572e 60%,#6a4c93);color:#fff;padding:14px 18px;text-align:center}
header h1{margin:2px 0;font-size:1.5rem}header p{margin:2px;font-size:.85rem}
#prog{display:flex;gap:6px;justify-content:center;padding:10px;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px #0002}
#prog span{width:34px;height:34px;border-radius:50%;background:#e5e5e5;display:grid;place-items:center;font-weight:800;font-size:.85rem;transition:.4s}
#prog .on{background:var(--o);color:#fff;transform:scale(1.15)}#prog .done{background:var(--g);color:#fff}
main{max-width:920px;margin:auto;padding:10px}
.scene{animation:in .6s}@keyframes in{from{opacity:0;transform:translateY(14px)}}
h2.st{margin:10px 0 4px;color:var(--r)}
.teach{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.av{font-size:2.6rem;animation:bob 2s infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.bub{background:#fff;border:3px solid var(--o);border-radius:16px;padding:8px 14px;position:relative;flex:1;box-shadow:0 2px 8px #0001}
.bub p{margin:6px 0;opacity:0;animation:fade .7s forwards}@keyframes fade{to{opacity:1}}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:0 2px 8px #0001;border-left:6px solid var(--o)}
.rem{background:#fdece6;border-left:6px solid var(--r);border-radius:12px;padding:10px 14px;margin:10px 0}
.chk{border-left-color:var(--g);background:#f3fbf6}.chk h3{margin:0 0 6px;color:var(--g)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.btn{border:0;border-radius:20px;padding:9px 15px;font-weight:700;cursor:pointer;background:var(--b);color:#fff;font-size:.92rem}.btn:disabled{background:#bbb;cursor:not-allowed}
.pill{border-radius:20px;padding:4px 11px;font-weight:700;color:#fff;display:inline-block;font-size:.85rem}
.acid{color:var(--o)}.met{color:var(--b)}.salt{color:var(--g)}.gas{color:var(--p)}.wat{color:#667}
.eq{font-size:1.1rem;font-weight:600;background:#fffaf0;border:2px dashed #f4c27a;border-radius:10px;padding:10px;margin:8px 0;line-height:1.9}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #e6d9c6;padding:6px 8px;text-align:center}th{background:#fde9c9}
.grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;max-width:400px;margin:8px 0}
.m{aspect-ratio:1;border-radius:50%;background:#f28c00;transition:.6s}.sp{background:linear-gradient(90deg,#2b6cb0 46%,transparent 46% 54%,#2e9d5b 54%);transform:scale(1.2)}
.ph{height:26px;border-radius:13px;background:linear-gradient(90deg,#e4572e,#f28c00,#f2d600,#2e9d5b,#2b6cb0,#6a4c93);position:relative;margin:30px 0 40px}
.ph i{position:absolute;top:-22px;transform:translateX(-50%);font-style:normal;font-size:.72rem;font-weight:700;white-space:nowrap}
.ph b{position:absolute;top:-4px;height:34px;border:3px solid #1f2a44;border-radius:8px;left:21%;width:14%}
.lit{height:30px;width:160px;border-radius:4px;background:#3b6fd8;transition:background 1.8s}.lit.red{background:#e0322f}
.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:9px 12px;border:2px solid #ddd;border-radius:10px;background:#fff;cursor:pointer;font-size:.95rem}
.opt.ok{background:#d9f3e3;border-color:var(--g)}.opt.no{background:#fde0d8;border-color:var(--r);opacity:.7}
.fb{font-weight:700;margin:4px 0}
.pop{animation:pop .8s;transform-box:fill-box;transform-origin:center}@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
.chip{display:inline-block;padding:8px 14px;border-radius:20px;color:#fff;font-weight:800;transition:transform 1.2s,opacity 1.2s}
.nav{display:flex;justify-content:space-between;margin:14px 0 30px}
.rv{background:#eef6ff;border-radius:10px;padding:8px 12px;margin:6px 0;cursor:pointer;border:2px dashed #9cc3ee}.rv div{display:none;margin-top:6px}.rv.s div{display:block}
footer{text-align:center;padding:14px;font-size:.8rem;color:#666}
</style></head><body>
<header><p>Prepared by Teacher Aasia Khawar</p><h1>🧪 Carboxylic Acids: a Storyboard</h1><p>Pearson Edexcel IGCSE Chemistry (4CH1) · Organic Chemistry · Learn the concept, then check your understanding</p></header>
<div id="prog"></div><main><div id="stage"></div><div class="nav"><button class="btn" id="bk" onclick="go(-1)">◀ Back</button><button class="btn" id="nx" onclick="go(1)">Next scene ▶</button></div></main>
<footer>© Made by Aasia Khawar</footer>
<script>
const $=id=>document.getElementById(id);
const f=s=>s.replace(/([A-Za-z)])(\d+)/g,'$1<sub>$2</sub>').replace(/\^(\d*[+\u2212])/g,'<sup>$1</sup>');
const cC='#444',cH='#3b82f6',cO='#ef4444';
/* ---------- molecule drawing ---------- */
function draw(n,hl,pop){const s=60,x0=60,y=110,xc=x0+(n-1)*s,W=xc+140;let L='',B='';
 const ln=(a,b,c,d)=>L+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#3b4256" stroke-width="3.5" stroke-linecap="round"/>`;
 const at=(x,yy,t,c,r,cl='')=>B+=`<g class="${cl}"><circle cx="${x}" cy="${yy}" r="${r}" fill="${c}"/><text x="${x}" y="${yy+5}" text-anchor="middle" font-size="${r>14?18:14}" font-weight="700" fill="#fff">${t}</text></g>`;
 for(let i=0;i<n-1;i++){const x=x0+i*s,p=pop&&i==n-2?' pop':'';ln(x,y,x+s,y);ln(x,y,x,y-50);ln(x,y,x,y+50);at(x,y-50,'H',cH,12,p);at(x,y+50,'H',cH,12,p);if(!i){ln(x,y,x-48,y);at(x-48,y,'H',cH,12)}at(x,y,'C',cC,17,'c'+p)}
 if(n==1){ln(xc,y,xc-48,y);at(xc-48,y,'H',cH,12)}
 ln(xc-3,y,xc-3,y-52);ln(xc+3,y,xc+3,y-52);ln(xc,y,xc+38,y+34);ln(xc+38,y+34,xc+82,y+34);
 at(xc,y-52,'O',cO,15);at(xc+38,y+34,'O',cO,15);at(xc+82,y+34,'H',cH,12);at(xc,y,'C',cC,17,'c');
 const r=hl?`<rect x="${xc-34}" y="${y-86}" width="150" height="132" rx="16" fill="#f28c00" fill-opacity=".18" stroke="#f28c00" stroke-width="3" stroke-dasharray="7 5"/>`:'';
 return `<svg id="sv" viewBox="0 0 ${W} 210" style="width:100%;max-width:${W*1.6}px">${r}${L}${B}</svg>`}
const A=[['methanoic acid','CH2O2','HCOOH','meth'],['ethanoic acid','C2H4O2','CH3COOH','eth'],['propanoic acid','C3H6O2','CH3CH2COOH','prop'],['butanoic acid','C4H8O2','CH3CH2CH2COOH','but']];
/* ---------- reactions data ---------- */
const R=[{n:'Magnesium',seg:[['Mg(s)','met'],' + ',['2CH3COOH(aq)','acid'],' → ',['(CH3COO)2Mg(aq)','salt'],' + ',['H2(g)','gas']],o:['Magnesium fizzes and slowly disappears','Colourless solution of <b>magnesium ethanoate</b>','Gas test: <b>H₂ gives a squeaky pop</b> with a lit splint'],nb:14,sp:1,s:'m'},
{n:'Zinc',seg:[['Zn(s)','met'],' + ',['2CH3COOH(aq)','acid'],' → ',['(CH3COO)2Zn(aq)','salt'],' + ',['H2(g)','gas']],o:['Slower bubbles than with hydrochloric acid','Colourless solution of <b>zinc ethanoate</b>','Gas test: <b>squeaky pop</b>'],nb:6,sp:.6,s:'m'},
{n:'Sodium carbonate',seg:[['Na2CO3(s)','met'],' + ',['2CH3COOH(aq)','acid'],' → ',['2CH3COONa(aq)','salt'],' + ',['CO2(g)','gas'],' + ',['H2O(l)','wat']],o:['<b>Lots of fizzing</b>','Colourless solution of <b>sodium ethanoate</b>'],nb:30,sp:1.6,s:'c'},
{n:'Calcium carbonate',seg:[['2CH3COOH(aq)','acid'],' + ',['CaCO3(s)','met'],' → ',['(CH3COO)2Ca(aq)','salt'],' + ',['CO2(g)','gas'],' + ',['H2O(l)','wat']],o:['<b>Lots of fizzing</b> as the solid dissolves','Colourless solution of <b>calcium ethanoate</b>'],nb:24,sp:1.3,s:'c'}];
const eqH=r=>r.seg.map(p=>typeof p=='string'?p:`<span class="${p[1]}">${f(p[0])}</span>`).join('');
function tube(r){let b='';for(let i=0;i<r.nb;i++){const x=68+Math.random()*52,d=(1.5+Math.random()*1.5)/r.sp,dl=Math.random()*3;
 b+=`<circle cx="${x}" r="${3+Math.random()*4}" fill="#fff" fill-opacity=".8" stroke="#7b5ea7" stroke-width="1.5"><animate attributeName="cy" from="205" to="85" dur="${d}s" begin="${dl}s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="${d}s" begin="${dl}s" repeatCount="indefinite"/></circle>`}
 const sol=r.s=='m'?'<rect x="86" y="150" width="16" height="62" rx="3" fill="#9aa3ad" transform="rotate(12 94 180)"/>':'<circle cx="80" cy="212" r="9" fill="#f4f4f4" stroke="#999"/><circle cx="100" cy="214" r="8" fill="#f4f4f4" stroke="#999"/><circle cx="90" cy="203" r="7" fill="#f4f4f4" stroke="#999"/>';
 return `<svg viewBox="0 0 190 260" style="width:100%"><path d="M57 80V215a38 38 0 0 0 76 0V80Z" fill="#d9ecff"/>${sol}${b}<path d="M55 30V215a40 40 0 0 0 80 0V30" fill="none" stroke="#445" stroke-width="4"/><line x1="48" y1="30" x2="142" y2="30" stroke="#445" stroke-width="4"/></svg>`}
function rpick(ids,box){return `<div class="row">`+ids.map(i=>`<button class="btn" style="background:${['#2b6cb0','#6a4c93','#2e9d5b','#e4572e'][i]}" onclick="showR(${i},'${box}')">${R[i].n}</button>`).join('')+`</div><div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><div id="${box}t" style="width:160px"></div><div style="flex:1;min-width:240px"><div class="eq" id="${box}e"></div><ul id="${box}o"></ul></div></div>`}
function showR(i,b){const r=R[i];$(b+'t').innerHTML=tube(r);$(b+'e').innerHTML=eqH(r);$(b+'o').innerHTML=r.o.map(x=>`<li>${x}</li>`).join('')}
/* ---------- scene animations ---------- */
let cn=2,hlOn=true;
function s1(){const q=(id,t,tr)=>setTimeout(()=>{const e=$(id);e.style.transform=tr;e.style.opacity=1},t);
 ['gC','gO','gH','gR'].forEach(id=>{$(id).style.transition='transform 1s,opacity 1s'});
 $('gC').style.transform='translate(-170px,0)';$('gO').style.transform='translate(0,-130px)';$('gH').style.transform='translate(170px,90px)';$('gR').style.transform='translate(-170px,0)';
 ['gO','gH','gR','bd','lb1','lb2','lb3','box'].forEach(id=>$(id).style.opacity=0);$('gC').style.opacity=1;
 q('gC',200,'none');q('gO',1200,'none');q('gH',2300,'none');q('bd',3400,'none');q('gR',4200,'none');q('lb1',4800,'none');q('lb2',5400,'none');q('box',6200,'none');q('lb3',6200,'none')}
function s2(add){if(add===0)cn=1;else if(add&&cn<4)cn++;$('vz').innerHTML=draw(cn,true,add);const a=A[cn-1];
 $('i2').innerHTML=`<b>${a[0]}</b> · molecular formula <b>${f(a[1])}</b> · structural formula <b>${f(a[2])}</b>`;$('ad').disabled=cn==4}
function s3(){const cs=[...document.querySelectorAll('#sv .c')].reverse(),a=A[cn-1];$('vz').innerHTML=draw(cn,true);const cs2=[...document.querySelectorAll('#sv .c')].reverse();
 cs2.forEach((g,k)=>setTimeout(()=>{g.querySelector('circle').setAttribute('fill','#f28c00');g.querySelector('text').textContent=k+1;g.classList.add('pop');
  if(k==cs2.length-1)$('m3').innerHTML=`${a[0].split(' ')[0]!=''?cn:''} carbon${cn>1?'s':''} in total → prefix "<span style="color:var(--r)">${a[3]}</span>" + "anoic acid" = <span style="color:var(--g)">${a[0]}</span>`},k*650))}
function pk3(i){cn=i+1;s3()}
function resetD(){['g1','g2'].forEach(id=>{$(id).innerHTML='';for(let i=0;i<75;i++){const d=document.createElement('div');d.className='m';$(id).appendChild(d)}});$('dm').innerHTML=''}
function dissolve(){resetD();[...$('g1').children].forEach((d,i)=>setTimeout(()=>d.classList.add('sp'),i*25));
 setTimeout(()=>$('g2').children[Math.floor(Math.random()*75)].classList.add('sp'),900);
 setTimeout(()=>$('dm').innerHTML='HCl: <span style="color:var(--b)">75 of 75</span> split into ions (strong). CH₃COOH: about <span style="color:var(--r)">1 in 75</span> splits (weak).',2000)}
function salt(){const a=$('c1'),b=$('c2');a.style.transform=b.style.transform='none';a.style.opacity=b.style.opacity=1;
 setTimeout(()=>{$('sf').innerHTML='<b style="color:var(--g)">(CH<sub>3</sub>COO)<sub>2</sub>Mg</b> &nbsp;✔ charges balance: (2+) + 2 × (1−) = 0';$('sf').style.opacity=1},1400)}
function lime(){$('lw').style.fill='#f6f6f6';$('lw').style.opacity=.95;$('lc').innerHTML='✔ Limewater turns <b>milky</b>: the gas is <b>carbon dioxide</b>.'}
function sr(i){showR(i,'rb')}
/* ---------- scenes ---------- */
const S=[
{t:'Scene 1 · What is a carboxylic acid?',say:['Welcome, scientists! 👋 Today we meet a very important family of organic compounds: the <b>carboxylic acids</b>.','Every member has the same <b>functional group</b>, –COOH. Watch it assemble, atom by atom!'],
 viz:`<svg viewBox="0 0 400 230" style="width:100%;max-width:560px"><rect id="box" x="120" y="30" width="190" height="150" rx="18" fill="#f28c00" fill-opacity=".18" stroke="#f28c00" stroke-width="3" stroke-dasharray="7 5"/>
 <g id="bd" stroke="#3b4256" stroke-width="4"><line x1="190" y1="110" x2="190" y2="60"/><line x1="196" y1="110" x2="196" y2="60"/><line x1="190" y1="110" x2="235" y2="140"/><line x1="235" y1="140" x2="285" y2="140"/><line x1="190" y1="110" x2="130" y2="110"/></g>
 <g id="gC"><circle cx="190" cy="110" r="20" fill="#444"/><text x="190" y="117" text-anchor="middle" fill="#fff" font-weight="800" font-size="20">C</text></g>
 <g id="gO"><circle cx="193" cy="52" r="17" fill="#ef4444"/><text x="193" y="59" text-anchor="middle" fill="#fff" font-weight="800" font-size="18">O</text></g>
 <g id="gH"><circle cx="235" cy="140" r="17" fill="#ef4444"/><text x="235" y="147" text-anchor="middle" fill="#fff" font-weight="800" font-size="18">O</text><circle cx="290" cy="140" r="13" fill="#3b82f6"/><text x="290" y="146" text-anchor="middle" fill="#fff" font-weight="800">H</text></g>
 <g id="gR"><circle cx="110" cy="110" r="18" fill="#6a4c93"/><text x="110" y="117" text-anchor="middle" fill="#fff" font-weight="800" font-size="18">R</text></g>
 <text id="lb1" x="250" y="55" fill="#c0392b" font-weight="700" font-size="14">C=O  carbonyl</text><text id="lb2" x="300" y="125" fill="#2b6cb0" font-weight="700" font-size="14" text-anchor="start" dy="0"></text>
 <text id="lb3" x="215" y="215" text-anchor="middle" fill="#c26a00" font-weight="800" font-size="17">carboxyl group = –COOH</text></svg><div id="lb2b"></div><div class="row"><span class="pill" style="background:#6a4c93">R = rest of the molecule (a carbon chain)</span><span class="pill" style="background:#ef4444">C=O + O–H on the SAME carbon</span></div><button class="btn" onclick="s1()">↺ Replay</button>`,
 init:s1,rem:'<b>Remember:</b> carboxyl = <b>carb</b>onyl (C=O) + hydr<b>oxyl</b> (O–H) joined on one carbon. Together they behave differently from either part alone.',
 q:[['Which description matches the carboxyl group?',['A C=O and an O–H on the same carbon atom','Only an O–H group on a carbon chain','A C=C double bond','An O–H on one carbon and a C=O on a different carbon'],0,'Both parts sit on the SAME carbon, which is why we write –COOH.']]},
{t:'Scene 2 · Draw the first four acids',say:['Let us build the first four members. Each one is the <b>previous one plus a CH₂ group</b>. That is what makes them a <b>homologous series</b>.','Press <b>"+ add a CH₂"</b> and watch the chain grow.'],
 viz:`<div class="row"><button class="btn" onclick="s2(0)">↺ Start: methanoic acid</button><button class="btn" id="ad" style="background:var(--g)" onclick="s2(1)">＋ add a CH₂</button></div><div id="i2" style="margin:6px 0"></div><div id="vz"></div><div class="row"><span class="pill" style="background:#444">C</span><span class="pill" style="background:#3b82f6">H</span><span class="pill" style="background:#ef4444">O</span><span class="pill" style="background:var(--o)">–COOH group</span></div>`,
 init:()=>{cn=1;s2()},rem:'<b>Hint for exams:</b> in a <b>displayed formula</b> draw <u>every</u> bond, including C=O and O–H of the –COOH. In an equation just write CH<sub>3</sub>COOH.',
 q:[['What must a displayed formula of propanoic acid show?',['Every atom and every bond, including C=O and O–H','Just the carbon skeleton','The group written as COOH with no bonds','Only the C=O bond'],0,'Displayed means ALL atoms and ALL bonds are drawn.'],['What is the molecular formula of propanoic acid?',['C3H6O2','C2H4O2','C3H8O','C4H8O2'],0,'3 C, 6 H, 2 O. Each member adds CH2.']]},
{t:'Scene 3 · Naming: count the carbons',say:['Now the naming rule, and it catches many students! 🔍','Count <b>all</b> the carbon atoms, <b>including the carbon in –COOH</b>. Pick an acid and watch the count.'],
 viz:`<div class="row">${A.map((a,i)=>`<button class="btn" style="background:${['#e4572e','#f28c00','#2e9d5b','#2b6cb0'][i]}" onclick="pk3(${i})">${f(a[2])}</button>`).join('')}</div><div id="vz"></div><p id="m3" style="font-weight:800;font-size:1.05rem"></p>`,
 init:()=>{cn=3;s3()},rem:'<b>Key point:</b> propanoic acid has <b>3</b> carbons in total, which is why it starts with <b>prop</b>. The –COOH is always on the end carbon, so <b>no number</b> is needed in the name.',
 q:[['Name CH3CH2CH2COOH.',['butanoic acid','propanoic acid','butanol','pentanoic acid'],0,'4 carbons including the –COOH carbon → but + anoic acid.'],['How many carbon atoms does ethanoic acid have?',['2','1','3','4'],0,'"eth" = 2, and the –COOH carbon is one of them.']]},
{t:'Scene 4 · Weak acids',say:['Carboxylic acids are <b>weak acids</b> 🧪. A weak acid only <b>partly dissociates</b> (splits into ions) in water.','Press <b>"Add to water"</b> and compare 75 molecules of hydrochloric acid and ethanoic acid.'],
 viz:`<div class="row"><button class="btn" onclick="dissolve()">💧 Add to water</button><button class="btn" style="background:#888" onclick="resetD()">↺ Reset</button></div><div style="display:flex;flex-wrap:wrap;gap:20px"><div><b>HCl (strong)</b><div class="grid" id="g1"></div></div><div><b>CH<sub>3</sub>COOH (weak)</b><div class="grid" id="g2"></div></div></div><div class="row"><span class="pill" style="background:var(--o)">intact molecule</span><span class="pill" style="background:var(--b)">H⁺</span><span class="pill" style="background:var(--g)">anion</span></div><p id="dm" style="font-weight:700"></p>
 <b>pH scale:</b> carboxylic acids have a pH of about <b>3–5</b>.<div class="ph"><i style="left:7%">HCl ≈ 1</i><b></b><i style="left:28%;top:36px">ethanoic acid 3–5</i><i style="left:50%">water 7</i></div>
 <b>Litmus test:</b> they turn blue litmus red.<div class="lit" id="lit"></div><button class="btn" style="margin-top:6px" onclick="$('lit').classList.toggle('red')">Dip litmus paper</button>`,
 init:resetD,rem:'<b>Extension:</b> strong/weak is about <b>how much it dissociates</b>, not how concentrated it is. Fewer H⁺ ions means ethanoic acid reacts <b>more slowly</b> than HCl of the same concentration.',
 q:[['Why is ethanoic acid called a weak acid?',['Only a small fraction of its molecules form H⁺ ions in water','It is very dilute','It contains no hydrogen','It does not react with metals'],0,'Weak = partial dissociation (about 1 in 75 molecules).'],['Which pH is typical for a carboxylic acid solution?',['3–5','0–1','7','12–14'],0,'Weak acids are mildly acidic, about pH 3–5.']]},
{t:'Scene 5 · Reaction with metals',say:['Carboxylic acids behave like any other acid: <b>metal + acid → salt + hydrogen</b> ⚡','The salt of ethanoic acid is called an <b>ethanoate</b>. Choose a metal and watch the bubbles. Zinc is slower than magnesium.'],
 viz:`${rpick([0,1],'rb')}<div class="card" style="border-color:var(--g)"><b>How do we write the salt?</b> Mg²⁺ needs <b>two</b> CH₃COO⁻ ions to balance the charge.<div class="row" style="min-height:48px;justify-content:center"><span class="chip" style="background:var(--g)">Mg²⁺</span><span class="chip" id="c1" style="background:var(--o);transform:translateX(-200px);opacity:0">CH₃COO⁻</span><span class="chip" id="c2" style="background:var(--o);transform:translateX(200px);opacity:0">CH₃COO⁻</span></div><button class="btn" onclick="salt()">⚖️ Balance the charges</button><p id="sf" style="font-size:1.2rem;opacity:0;transition:1s"></p></div>`,
 init:()=>showR(0,'rb'),rem:'<b>Remember:</b> metal + acid → <b>metal ethanoate</b> + hydrogen. Test the gas with a lit splint: <b>squeaky pop</b> = H<sub>2</sub>. Metals below hydrogen in the reactivity series do not react.',
 q:[['What is the formula of zinc ethanoate?',['(CH3COO)2Zn','CH3COOZn','Zn(CH3COO)','ZnCH3COOH'],0,'Zn²⁺ needs two CH3COO⁻ ions.'],['Which gas is made when magnesium reacts with ethanoic acid?',['Hydrogen','Oxygen','Carbon dioxide','Ethane'],0,'Metal + acid → salt + hydrogen (squeaky pop).']]},
